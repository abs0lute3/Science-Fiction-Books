# Invisible LTS — recommended NGINX reverse proxy (NOT Caddy).
# mrrowisp uses loopback WebSockets; NGINX handles Upgrade correctly.
# Usage:
#   1. Point your A records (@, www) at this host.
#   2. Copy this file to /etc/nginx/sites-available/invisible and symlink to sites-enabled.
#   3. Set server_name below, then: sudo nginx -t && sudo systemctl reload nginx
#   4. Terminate TLS in NGINX (certbot) and keep Node on 127.0.0.1:8080.

upstream invisible_upstream {
  server 127.0.0.1:8080;
  keepalive 64;
}

# Upgrade map for WebSocket (Wisp) support
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name example.com www.example.com;

  # Optional: redirect to HTTPS once certbot is configured
  # return 301 https://$host$request_uri;

  client_max_body_size 50m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://invisible_upstream;
    proxy_http_version 1.1;

    # WebSocket (Wisp) support — REQUIRED for proxying to work
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    # mrrowisp loopback safety: only trust local upstream
    proxy_set_header X-Forwarded-Host $host;
  }

  # Cache immutable versioned assets aggressively; HTML stays fresh
  location ~* \.(css|js|mjs|wasm|png|webp|svg|ico|woff2?)$ {
    proxy_pass http://invisible_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Security headers (Fastify Helmet also sets most of these)
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
